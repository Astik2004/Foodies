events {}

http {

    upstream backend {
        server host.docker.internal:8080;
        server host.docker.internal:8081;
        server host.docker.internal:8082;
    }

    server {

        listen 80;

        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout 300;

        location / {
            proxy_pass http://backend;
        }
    }
}